<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backend Project Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a2e;
  --accent:#6c63ff;--accent2:#ff6584;--accent3:#43e97b;--accent4:#fbbf24;
  --accent-dim:rgba(108,99,255,.12);--accent-bd:rgba(108,99,255,.35);
  --green-dim:rgba(67,233,123,.1);--red-dim:rgba(255,101,132,.1);--amber-dim:rgba(251,191,36,.1);
  --text:#e8e8f0;--text2:#a0a0b8;--text3:#666680;
  --border:#2a2a40;--card:#16162a;
  --mono:'JetBrains Mono',monospace;
}
[data-theme="light"]{
  --bg:#f5f5fa;--bg2:#fff;--bg3:#eeeef4;
  --accent:#5b52e0;--accent2:#e0446c;--accent3:#16a34a;--accent4:#d97706;
  --accent-dim:rgba(91,82,224,.08);--accent-bd:rgba(91,82,224,.3);
  --green-dim:rgba(22,163,74,.08);--red-dim:rgba(224,68,108,.08);--amber-dim:rgba(217,119,6,.08);
  --text:#1a1a2e;--text2:#555570;--text3:#8888a0;
  --border:#dddde8;--card:#fff;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:300px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);height:100vh;position:sticky;top:0;overflow-y:auto;display:flex;flex-direction:column}
.sb-head{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
.sb-brand{font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
.sb-title{font-size:1.05rem;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.sb-sub{font-size:.72rem;color:var(--text3);margin-top:2px}
.sb-tools{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.sb-tools button{background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:.68rem;padding:5px 9px;border-radius:7px;cursor:pointer;font-family:inherit;transition:.15s}
.sb-tools button:hover{border-color:var(--accent-bd);color:var(--text)}
.sb-tools button.active{background:var(--accent-dim);border-color:var(--accent-bd);color:var(--accent)}
.sb-search{padding:10px 16px;border-bottom:1px solid var(--border)}
.sb-search input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text);font-size:.78rem;font-family:inherit;outline:none}
.sb-search input:focus{border-color:var(--accent-bd)}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0 30px}
.sb-section{margin-bottom:2px}
.sb-section-head{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;transition:.15s}
.sb-section-head:hover{background:var(--bg3)}
.sb-section-label{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);flex:1}
.sb-section-count{font-family:var(--mono);font-size:.64rem;color:var(--text3)}
.sb-section-arrow{font-size:.6rem;color:var(--text3);transition:transform .2s}
.sb-section.open .sb-section-arrow{transform:rotate(90deg)}
.sb-items{display:none;padding:2px 0 8px}
.sb-section.open .sb-items{display:block}
.sb-item{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 28px;cursor:pointer;font-size:.74rem;color:var(--text2);transition:.12s}
.sb-item:hover{color:var(--text);background:var(--bg3)}
.sb-item.active{color:var(--accent);background:var(--accent-dim)}
.sb-item .dot{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--text3);flex-shrink:0}
.sb-item.done .dot{background:var(--accent3);border-color:var(--accent3)}
.sb-item.in-progress .dot{background:var(--accent4);border-color:var(--accent4)}
.sb-item-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item-badge{font-family:var(--mono);font-size:.58rem;padding:1px 5px;border-radius:4px;font-weight:600;flex-shrink:0}
.sb-item-badge.beginner{background:var(--green-dim);color:var(--accent3)}
.sb-item-badge.intermediate{background:var(--amber-dim);color:var(--accent4)}
.sb-item-badge.advanced{background:var(--red-dim);color:var(--accent2)}

/* Progress bar */
.progress-top{height:3px;background:var(--border);position:sticky;top:0;z-index:20}
.progress-top>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent3));transition:.3s}

/* Main content */
.main{flex:1;min-width:0}
.reader{max-width:900px;margin:0 auto;padding:46px 40px 120px;width:100%}

/* Stats bar */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:36px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat-label{font-size:.68rem;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono)}
.stat-value{font-size:1.8rem;font-weight:800;margin-top:4px}
.stat-value.accent{color:var(--accent)}
.stat-value.green{color:var(--accent3)}
.stat-value.amber{color:var(--accent4)}
.stat-value.red{color:var(--accent2)}
.stat-sub{font-size:.72rem;color:var(--text3);margin-top:2px}

/* Source tabs */
.source-tabs{display:flex;gap:6px;margin-bottom:24px}
.source-tab{background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:.78rem;padding:8px 16px;border-radius:9px;cursor:pointer;font-family:inherit;font-weight:600;transition:.15s}
.source-tab:hover{border-color:var(--accent-bd);color:var(--text)}
.source-tab.active{background:var(--accent-dim);border-color:var(--accent-bd);color:var(--accent)}

/* Project cards */
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.project-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;transition:.2s;cursor:pointer;position:relative}
.project-card:hover{border-color:var(--accent-bd);transform:translateY(-1px)}
.project-card.done{border-color:rgba(67,233,123,.3)}
.project-card.in-progress{border-color:rgba(251,191,36,.3)}
.pc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pc-badge{font-family:var(--mono);font-size:.62rem;padding:2px 8px;border-radius:5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.pc-badge.beginner{background:var(--green-dim);color:var(--accent3)}
.pc-badge.intermediate{background:var(--amber-dim);color:var(--accent4)}
.pc-badge.advanced{background:var(--red-dim);color:var(--accent2)}
.pc-type{font-family:var(--mono);font-size:.6rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.pc-name{font-size:.92rem;font-weight:700;margin-bottom:6px}
.pc-desc{font-size:.78rem;color:var(--text2);line-height:1.5;margin-bottom:12px}
.pc-footer{display:flex;align-items:center;gap:8px}
.pc-status{font-size:.7rem;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:600;border:1px solid var(--border);background:var(--bg3);color:var(--text2);transition:.15s}
.pc-status:hover{border-color:var(--accent-bd)}
.pc-status.todo{background:var(--bg3);color:var(--text3)}
.pc-status.in-progress{background:var(--amber-dim);color:var(--accent4);border-color:rgba(251,191,36,.3)}
.pc-status.done{background:var(--green-dim);color:var(--accent3);border-color:rgba(67,233,123,.3)}
.pc-category{font-family:var(--mono);font-size:.6rem;color:var(--text3);margin-left:auto}
.pc-link{font-size:.68rem;color:var(--accent);text-decoration:none;font-weight:600}
.pc-link:hover{text-decoration:underline}

/* Section header */
.section-header{margin:32px 0 16px;display:flex;align-items:center;gap:10px}
.section-header h2{font-size:1.1rem;font-weight:700;letter-spacing:-.01em}
.section-header h2::before{content:"";display:inline-block;width:3px;height:18px;background:var(--accent);border-radius:2px;margin-right:8px;vertical-align:middle}
.section-count{font-family:var(--mono);font-size:.68rem;color:var(--text3)}

/* Filter bar */
.filters{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.filter-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:.7rem;padding:5px 12px;border-radius:7px;cursor:pointer;font-family:inherit;font-weight:500;transition:.15s}
.filter-btn:hover{border-color:var(--accent-bd);color:var(--text)}
.filter-btn.active{background:var(--accent-dim);border-color:var(--accent-bd);color:var(--accent)}

/* Mobile */
.menu-btn{display:none;position:fixed;top:12px;left:12px;z-index:60;background:var(--bg2);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:10px;font-size:1.1rem;cursor:pointer}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:none}
  .overlay.show{display:block}
  .menu-btn{display:block}
  .reader{padding:64px 16px 100px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .project-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<button class="menu-btn" id="menuBtn">☰</button>
<div class="overlay" id="overlay"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-brand">TRACKER</div>

    </div>
    <div class="sb-search"><input id="search" placeholder="Search projects…"></div>

  <main class="main">

</div>

const STORE_KEY = 'project-tracker-status';
const THEME_KEY = 'project-tracker-theme';
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

let statuses = JSON.parse(store.get(STORE_KEY) || '{}');
let activeSource = 'all';
let activeLevel = 'all';
let searchQuery = '';

function getStatus(id){ return statuses[id] || 'todo'; }
function cycleStatus(id){
  const order = ['todo','in-progress','done'];
  const cur = order.indexOf(getStatus(id));
  statuses[id] = order[(cur+1) % 3];
  store.set(STORE_KEY, JSON.stringify(statuses));
  render();
}

function getFiltered(){
  return PROJECTS.filter(p => {
    if(activeSource !== 'all' && p.source !== activeSource) return false;
    if(activeLevel !== 'all' && p.level !== activeLevel) return false;
    if(searchQuery && !p.name.toLowerCase().includes(searchQuery) && !p.desc.toLowerCase().includes(searchQuery) && !p.category.toLowerCase().includes(searchQuery)) return false;
    return true;
  });
}

function renderStats(){
  const all = getFiltered();
  const done = all.filter(p => getStatus(p.id) === 'done').length;
  const inProg = all.filter(p => getStatus(p.id) === 'in-progress').length;
  const todo = all.length - done - inProg;
  const pct = all.length ? Math.round(done/all.length*100) : 0;

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">Total</div><div class="stat-value accent">${all.length}</div><div class="stat-sub">projects available</div></div>
    <div class="stat"><div class="stat-label">Done</div><div class="stat-value green">${done}</div><div class="stat-sub">${pct}% complete</div></div>
    <div class="stat"><div class="stat-label">In Progress</div><div class="stat-value amber">${inProg}</div><div class="stat-sub">currently building</div></div>
    <div class="stat"><div class="stat-label">Todo</div><div class="stat-value red">${todo}</div><div class="stat-sub">remaining</div></div>
  `;

  const totalAll = PROJECTS.length;
  const doneAll = PROJECTS.filter(p => getStatus(p.id) === 'done').length;
  document.getElementById('progressBar').style.width = (doneAll/totalAll*100)+'%';
}

function renderSourceTabs(){
  const tabs = [
    {key:'all',label:'All Projects'},
    {key:'roadmap.sh',label:'roadmap.sh (25)'},
    {key:'rustam',label:'Rustam Zokirov (51)'}
  ];
  document.getElementById('sourceTabs').innerHTML = tabs.map(t =>
    `<button class="source-tab${activeSource===t.key?' active':''}" data-src="${t.key}">${t.label}</button>`
  ).join('');
}

function renderFilters(){
  const levels = [
    {key:'all',label:'All Levels'},
    {key:'beginner',label:'Beginner'},
    {key:'intermediate',label:'Intermediate'},
    {key:'advanced',label:'Advanced'}
  ];
  const statusFilters = [
    {key:'all',label:'All Status'},
    {key:'todo',label:'Todo'},
    {key:'in-progress',label:'In Progress'},
    {key:'done',label:'Done'}
  ];
  document.getElementById('filters').innerHTML =
    levels.map(l => `<button class="filter-btn${activeLevel===l.key?' active':''}" data-level="${l.key}">${l.label}</button>`).join('') +
    '<span style="width:12px"></span>';
}

function renderProjects(){
  const filtered = getFiltered();
  const groups = {};
  filtered.forEach(p => {
    (groups[p.category] = groups[p.category] || []).push(p);
  });

  let html = '';
  Object.keys(groups).forEach(cat => {
    const items = groups[cat];
    const doneCount = items.filter(p => getStatus(p.id) === 'done').length;
    html += `<div class="section-header"><h2>${cat}</h2><span class="section-count">${doneCount}/${items.length}</span></div>`;
    html += '<div class="project-grid">';
    items.forEach(p => {
      const st = getStatus(p.id);
      const stLabel = st === 'in-progress' ? 'In Progress' : st === 'done' ? 'Done' : 'Todo';
      html += `<div class="project-card ${st}" data-id="${p.id}">
        <div class="pc-top">
          <span class="pc-badge ${p.level}">${p.level}</span>
          <span class="pc-type">${p.type}</span>
        </div>
        <div class="pc-name">${p.name}</div>
        <div class="pc-desc">${p.desc}</div>
        <div class="pc-footer">
          <button class="pc-status ${st}" data-id="${p.id}">${stLabel}</button>
          ${p.link ? `<a class="pc-link" href="${p.link}" target="_blank" rel="noopener">roadmap.sh →</a>` : ''}
          <span class="pc-category">${p.source === 'rustam' ? 'RZ' : 'RS'}</span>
        </div>
      </div>`;
    });
    html += '</div>';
  });

  document.getElementById('content').innerHTML = html;
}

function renderSidebar(){
  const nav = document.getElementById('nav');
  const sources = [
    {key:'roadmap.sh', label:'ROADMAP.SH'},
    {key:'rustam', label:'RUSTAM ZOKIROV'}
  ];

  let html = '';
  sources.forEach(src => {
    const items = PROJECTS.filter(p => p.source === src.key);
    const cats = {};
    items.forEach(p => { (cats[p.category] = cats[p.category] || []).push(p); });

    Object.keys(cats).forEach(cat => {
      const catItems = cats[cat];
      const doneCount = catItems.filter(p => getStatus(p.id) === 'done').length;
      html += `<div class="sb-section open" data-cat="${cat}">
        <div class="sb-section-head">
          <span class="sb-section-label">${cat}</span>
          <span class="sb-section-count">${doneCount}/${catItems.length}</span>
          <span class="sb-section-arrow">▶</span>
        </div>
        <div class="sb-items">`;
      catItems.forEach(p => {
        const st = getStatus(p.id);
        html += `<div class="sb-item ${st}" data-id="${p.id}">
          <span class="dot"></span>
          <span class="sb-item-name">${p.name}</span>
          <span class="sb-item-badge ${p.level}">${p.level.charAt(0).toUpperCase()}</span>
        </div>`;
      });
      html += '</div></div>';
    });
  });

  nav.innerHTML = html;
}

function render(){
  renderStats();
  renderSourceTabs();
  renderFilters();
  renderProjects();
  renderSidebar();
}

// Event delegation
document.getElementById('content').addEventListener('click', e => {
  const btn = e.target.closest('.pc-status');
  if(btn){
    e.stopPropagation();
    cycleStatus(btn.dataset.id);
  }
});

document.getElementById('sourceTabs').addEventListener('click', e => {
  const tab = e.target.closest('.source-tab');
  if(tab){ activeSource = tab.dataset.src; render(); }
});

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if(btn && btn.dataset.level){ activeLevel = btn.dataset.level; render(); }
});

document.getElementById('nav').addEventListener('click', e => {
  const head = e.target.closest('.sb-section-head');
  if(head){ head.parentElement.classList.toggle('open'); return; }
  const item = e.target.closest('.sb-item');
  if(item){ cycleStatus(item.dataset.id); }
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.toLowerCase().trim();
  render();
});

// Theme
const themeBtn = document.getElementById('themeBtn');
function applyTheme(t){
  if(t==='light'){document.documentElement.setAttribute('data-theme','light');themeBtn.textContent='🌙 Dark';}
  else{document.documentElement.removeAttribute('data-theme');themeBtn.textContent='☀ Light';}
}
applyTheme(store.get(THEME_KEY)||'dark');
themeBtn.addEventListener('click', ()=>{
  const light = document.documentElement.getAttribute('data-theme')==='light';
  const n = light?'dark':'light'; applyTheme(n); store.set(THEME_KEY, n);
});

document.getElementById('expandBtn').addEventListener('click', ()=>document.querySelectorAll('.sb-section').forEach(s=>s.classList.add('open')));
document.getElementById('collapseBtn').addEventListener('click', ()=>document.querySelectorAll('.sb-section').forEach(s=>s.classList.remove('open')));

// Mobile menu
document.getElementById('menuBtn').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
});
document.getElementById('overlay').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
});

render();
})();
</script>
</body>
</html>
